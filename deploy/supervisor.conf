; Step Shine Works queue and scheduler.
; Update the project path and user before installing this file.

[program:step-shine-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/step-shine/artisan queue:work database --sleep=3 --tries=3 --max-time=3600
directory=/var/www/step-shine
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=3600
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/step-shine-queue.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

[program:step-shine-scheduler]
command=php /var/www/step-shine/artisan schedule:work
directory=/var/www/step-shine
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/supervisor/step-shine-scheduler.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
