; Supervisor config untuk Step Shine Works — Queue Worker
;
; CARA INSTALL DI SERVER (Ubuntu/Debian):
;   sudo apt install supervisor
;   sudo cp /path/to/project/deploy/supervisor.conf /etc/supervisor/conf.d/step-shine.conf
;   sudo nano /etc/supervisor/conf.d/step-shine.conf   ← sesuaikan path & user
;   sudo supervisorctl reread
;   sudo supervisorctl update
;   sudo supervisorctl start step-shine-queue:*
;
; CEK STATUS:
;   sudo supervisorctl status
;
; RESTART SETELAH DEPLOY:
;   sudo supervisorctl restart step-shine-queue:*

[program:step-shine-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/step-shine/artisan queue:work database --sleep=3 --tries=3 --max-time=3600
; ↑ Ganti path sesuai lokasi project di server

autostart=true
autorestart=true
stopasgroup=true
killasgroup=true

user=www-data
; ↑ Ganti dengan user web server kamu (www-data / nginx / deploy)

numprocs=1
; ↑ Untuk toko kecil 1 worker cukup. Naikkan ke 2-3 jika notif WA sering antri.

redirect_stderr=true
stdout_logfile=/var/log/supervisor/step-shine-queue.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

stopwaitsecs=3600
; ↑ Tunggu job yang sedang berjalan selesai sebelum stop (maks 1 jam)
